name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests
      - name: Run tests
        run: go test ./...
      - name: Run harness eval regression check
        run: go run ./cmd/namba eval --suite harness --format json --baseline internal/namba/testdata/evals/harness/baseline.json --fail-on-regression
      - name: Run vet
        run: go vet ./...
      - name: Check formatting
        run: |
          out="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          test -z "$out" || { printf '%s\n' "$out"; exit 1; }
